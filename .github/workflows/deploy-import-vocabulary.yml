name: Deploy import-vocabulary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-import-vocabulary-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in repository Settings → Secrets and variables → Actions."
            exit 1
          fi

          npx --yes supabase@3.3.0 functions deploy import-vocabulary \
            --remote=clgthcxiwybgqbccrptc \
            --yes \
            --use-api \
            --no-verify-jwt
