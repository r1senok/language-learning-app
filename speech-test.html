<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Takku — тест Web Speech API</title>
  </head>
  <body>
    <main>
      <h1>Тест эстонской озвучки</h1>
      <p id="voice-status" role="status">Проверяем голоса…</p>
      <div id="samples" aria-label="Эстонские примеры">
        <button type="button" data-sample="Tere" lang="et">Tere</button>
        <button type="button" data-sample="Aitäh" lang="et">Aitäh</button>
        <button type="button" data-sample="Õpetaja" lang="et">Õpetaja</button>
        <button type="button" data-sample="Ma ei ole õpetaja" lang="et">Ma ei ole õpetaja</button>
      </div>
      <p id="playback-status" role="status"></p>
      <h2>Голоса браузера</h2>
      <button id="refresh" type="button">Обновить список</button>
      <p id="voice-count"></p>
      <ul id="voices"></ul>
    </main>
    <script type="module" src="/src/speech-diagnostics.ts"></script>
  </body>
</html>
